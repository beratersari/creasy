<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creasy webhook tester</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020; --panel: #162038; --border: #2c3a5e;
      --text: #f4f6ff; --muted: #7b88a8; --accent: #7c9cff;
      --ok: #3ecf8e; --bad: #f25c54; --warn: #e6b450;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.1rem 3rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .2rem; }
    .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.1rem; }
    .sub a { color: var(--accent); }
    .grid { display: grid; gap: 1rem; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.1fr .9fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
    label { display: block; font-size: .75rem; color: var(--muted); margin: .55rem 0 .2rem; }
    input, select, textarea {
      width: 100%; background: #0b1020; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: .5rem .65rem; font: inherit;
    }
    textarea { min-height: 4.2rem; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .events { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .85rem; }
    button {
      border: 0; border-radius: 999px; padding: .5rem .95rem;
      background: var(--accent); color: #0b1020; font-weight: 700; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: #f25c54; color: #1a0d0c; }
    .status { font-size: .85rem; margin-top: .8rem; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .pill { display: inline-block; border-radius: 999px; padding: .1rem .5rem; font-size: .75rem; font-weight: 700; }
    .pill.up { background: #3ecf8e22; color: var(--ok); }
    .pill.down { background: #f25c5422; color: var(--bad); }
    pre { white-space: pre-wrap; word-break: break-word; font-size: .78rem; color: #b4bfd9; margin: .4rem 0 0; max-height: 28rem; overflow: auto; }
    .log { border-top: 1px solid var(--border); padding: .65rem 0; }
    .log:first-child { border-top: 0; padding-top: 0; }
    .meta { font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Creasy webhook tester</h1>
    <p class="sub">
      Posts fake GitLab hooks at <code id="target">/webhook</code>.
      Default repo is <code>beratersari0/test_project</code> MR <code>!30</code>.
      Dashboard: <a href="http://127.0.0.1:8000/jobs" target="_blank" rel="noreferrer">/jobs</a>
      · <span id="health" class="pill down">creasy ?</span>
    </p>
    <div class="grid">
      <section class="panel">
        <label>Repository</label>
        <select id="repo"></select>
        <div class="row">
          <div>
            <label>project_id</label>
            <input id="project_id" type="number" />
          </div>
          <div>
            <label>MR iid</label>
            <select id="mr_iid"></select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>source_branch</label>
            <input id="source_branch" />
          </div>
          <div>
            <label>target_branch</label>
            <input id="target_branch" />
          </div>
        </div>
        <label>/ask question (used only by /ask)</label>
        <textarea id="note" placeholder="what is the main risk?"></textarea>
        <div class="events" id="events"></div>
        <div class="status" id="status">Ready.</div>
      </section>
      <section class="panel">
        <div class="meta">Last replies (newest first)</div>
        <div id="log"></div>
      </section>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { repos: [], mrs: [], events: [] };

    function selectedRepo() {
      return state.repos.find((r) => String(r.project_id) === $("repo").value) || state.repos[0];
    }

    function selectedMr() {
      const iid = Number($("mr_iid").value);
      return state.mrs.find((m) => Number(m.iid) === iid) || null;
    }

    function fillMrs(list, preferred) {
      const sel = $("mr_iid");
      sel.innerHTML = "";
      const rows = list.length ? list : [{ iid: preferred, title: "default", source_branch: "", target_branch: "" }];
      for (const mr of rows) {
        const opt = document.createElement("option");
        opt.value = mr.iid;
        opt.textContent = `!${mr.iid} ${mr.title || ""}`.trim();
        sel.appendChild(opt);
      }
      const want = String(preferred);
      if ([...sel.options].some((o) => o.value === want)) sel.value = want;
      applyMr();
    }

    function applyMr() {
      const mr = selectedMr();
      const repo = selectedRepo();
      if (mr && mr.source_branch) $("source_branch").value = mr.source_branch;
      else if (repo) $("source_branch").value = repo.source_branch;
      if (mr && mr.target_branch) $("target_branch").value = mr.target_branch;
      else if (repo) $("target_branch").value = repo.target_branch;
    }

    async function loadMrs() {
      const projectId = Number($("project_id").value);
      const repo = selectedRepo();
      const preferred = repo && Number(repo.project_id) === projectId ? repo.default_mr_iid : projectId;
      try {
        const res = await fetch(`/api/mrs?project_id=${projectId}`);
        const data = await res.json();
        state.mrs = data.mrs || [];
        fillMrs(state.mrs, repo ? repo.default_mr_iid : preferred);
      } catch (err) {
        fillMrs([], repo ? repo.default_mr_iid : 1);
      }
    }

    function addLog(entry) {
      const box = $("log");
      const div = document.createElement("div");
      div.className = "log";
      const ok = entry.http >= 200 && entry.http < 300;
      const status = (entry.response && entry.response.status) || "";
      div.innerHTML = `<div class="meta">${entry.event} · HTTP ${entry.http} · ${status}</div>`;
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(entry.response || entry.detail || entry, null, 2);
      div.appendChild(pre);
      if (!ok) pre.style.color = "var(--bad)";
      box.prepend(div);
    }

    async function fire(event) {
      $("status").className = "status";
      $("status").textContent = `Sending ${event}…`;
      const mr = selectedMr();
      const body = {
        event,
        project_id: Number($("project_id").value),
        mr_iid: Number($("mr_iid").value),
        source_branch: $("source_branch").value,
        target_branch: $("target_branch").value,
        note: $("note").value,
        sha: mr && mr.sha || "",
        web_url: mr && mr.web_url || (selectedRepo() && selectedRepo().web_url) || "",
      };
      try {
        const res = await fetch("/api/fire", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        addLog({ event, ...data });
        const st = data.response && data.response.status;
        $("status").className = "status ok";
        $("status").textContent = `Creasy said ${data.http} ${st || ""}`.trim();
      } catch (err) {
        $("status").className = "status bad";
        $("status").textContent = String(err.message || err);
        addLog({ event, http: 0, detail: String(err.message || err) });
      }
    }

    async function ping() {
      try {
        const res = await fetch("/api/creasy-health");
        const data = await res.json();
        const up = data.http === 200;
        $("health").className = "pill " + (up ? "up" : "down");
        $("health").textContent = up ? "creasy up" : "creasy down";
      } catch {
        $("health").className = "pill down";
        $("health").textContent = "creasy down";
      }
    }

    async function init() {
      const meta = await fetch("/api/meta").then((r) => r.json());
      $("target").textContent = meta.creasy_url + "/webhook";
      state.repos = meta.repos || [];
      state.events = meta.events || [];
      const repoSel = $("repo");
      for (const repo of state.repos) {
        const opt = document.createElement("option");
        opt.value = repo.project_id;
        opt.textContent = `${repo.label} · ${repo.project_id}`;
        repoSel.appendChild(opt);
      }
      const custom = document.createElement("option");
      custom.value = "custom";
      custom.textContent = "Custom project id…";
      repoSel.appendChild(custom);
      repoSel.value = String(meta.default_project_id);
      $("project_id").value = meta.default_project_id;
      for (const ev of state.events) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = ev.label;
        if (ev.kind === "cleanup") btn.className = "danger";
        if (ev.kind === "auto") btn.className = "ghost";
        btn.addEventListener("click", () => fire(ev.id));
        $("events").appendChild(btn);
      }
      repoSel.addEventListener("change", () => {
        if (repoSel.value === "custom") return;
        $("project_id").value = repoSel.value;
        loadMrs();
      });
      $("project_id").addEventListener("change", loadMrs);
      $("mr_iid").addEventListener("change", applyMr);
      await loadMrs();
      await ping();
      setInterval(ping, 5000);
    }
    init();
  </script>
</body>
</html>
