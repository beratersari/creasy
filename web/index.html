<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creasy jobs</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e26;
      --line: #263040;
      --text: #e7eef7;
      --muted: #8aa0b8;
      --accent: #5eead4;
      --warn: #fbbf24;
      --bad: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
    header h1 span { color: var(--accent); }
    header input, header select, header button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
    }
    header button { cursor: pointer; }
    main { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
    #list { overflow: auto; border-right: 1px solid var(--line); }
    .job {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .job:hover, .job.active { background: var(--panel); }
    .job .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
    .muted { color: var(--muted); font-size: 12px; }
    .st { font-weight: 600; text-transform: uppercase; font-size: 11px; }
    .st.running, .st.queued { color: var(--warn); }
    .st.success { color: var(--ok); }
    .st.error, .st.timeout, .st.cancelled { color: var(--bad); }
    #detail { overflow: auto; padding: 20px 24px; }
    pre {
      background: #0b1016;
      border: 1px solid var(--line);
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .actions { display: flex; gap: 8px; margin: 12px 0 20px; }
    .actions button { background: #3f1d1d; color: #fecaca; border: 1px solid #7f1d1d; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    h3 { font-size: 13px; color: var(--muted); margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  </style>
</head>
<body>
  <header>
    <h1>CREASY <span>jobs</span></h1>
    <select id="filter">
      <option value="all">all</option>
      <option value="active">active</option>
      <option value="queued">queued</option>
      <option value="completed">completed</option>
      <option value="error">error</option>
    </select>
    <input id="mr" placeholder="mr_key e.g. 42-17" />
    <input id="token" placeholder="dashboard token" type="password" />
    <button id="reload">Reload</button>
  </header>
  <main>
    <section id="list"></section>
    <section id="detail"><p class="muted">Select a job.</p></section>
  </main>
  <script>
    const headers = () => {
      const token = document.getElementById("token").value.trim();
      return token ? { "X-Creasy-Token": token } : {};
    };
    let selected = null;

    async function loadList() {
      const filter = document.getElementById("filter").value;
      const mr = document.getElementById("mr").value.trim();
      const qs = new URLSearchParams({ filter, page_size: "50" });
      if (mr) qs.set("mr_key", mr);
      const res = await fetch("/api/jobs?" + qs, { headers: headers() });
      const data = await res.json();
      const list = document.getElementById("list");
      list.innerHTML = "";
      (data.jobs || []).forEach((job) => {
        const el = document.createElement("div");
        el.className = "job" + (selected === job.job_id ? " active" : "");
        el.innerHTML = `
          <div class="row"><strong>${job.mr_key}</strong><span class="st ${job.status}">${job.status}</span></div>
          <div class="muted">${job.trigger} · ${job.job_id}</div>`;
        el.onclick = () => { selected = job.job_id; loadDetail(job.job_id); loadList(); };
        list.appendChild(el);
      });
      if (!data.jobs || !data.jobs.length) list.innerHTML = '<p class="muted" style="padding:16px">No jobs.</p>';
    }

    async function loadDetail(id) {
      const [jobRes, chatRes, logRes] = await Promise.all([
        fetch("/api/jobs/" + id, { headers: headers() }),
        fetch("/api/jobs/" + id + "/chat", { headers: headers() }),
        fetch("/api/jobs/" + id + "/logs", { headers: headers() }),
      ]);
      const jobWrap = await jobRes.json();
      const chat = await chatRes.json();
      const logs = await logRes.json();
      const job = jobWrap.job;
      const detail = document.getElementById("detail");
      detail.innerHTML = `
        <h2>${job.mr_key} <span class="st ${job.status}">${job.status}</span></h2>
        <div class="muted">${job.job_id} · ${job.trigger} · ${job.model || ""}</div>
        <div class="muted">${job.web_url || ""}</div>
        <div class="actions">
          <button onclick="cancelJob('${job.job_id}')">Cancel job</button>
          <button onclick="cancelMr(${job.project_id}, ${job.mr_iid})">Cancel all for MR</button>
        </div>
        <h3>Result</h3>
        <pre>${escapeHtml(job.text || job.error_message || "")}</pre>
        <h3>Chat</h3>
        <pre>${escapeHtml(JSON.stringify(chat.chat || [], null, 2))}</pre>
        <h3>Logs</h3>
        <pre>${escapeHtml((logs.lines || []).join("\\n"))}</pre>
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    async function cancelJob(id) {
      await fetch("/api/jobs/" + id + "/cancel", { method: "POST", headers: headers() });
      loadList();
      loadDetail(id);
    }
    async function cancelMr(projectId, iid) {
      await fetch("/api/mrs/" + projectId + "/" + iid + "/cancel", { method: "POST", headers: headers() });
      loadList();
    }

    document.getElementById("reload").onclick = loadList;
    document.getElementById("filter").onchange = loadList;
    document.getElementById("mr").onchange = loadList;
    loadList();
    setInterval(loadList, 4000);
  </script>
</body>
</html>
