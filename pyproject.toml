[project]
name = "creasy"
version = "0.1.0"
description = "Code review easy — GitLab webhook reviews driven by OpenCode"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
creasy = "creasy.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
markers = [
    "live_opencode: real OpenCode binary and model; skipped unless CREASY_LIVE_OPENCODE=1",
]
