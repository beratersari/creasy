name: release

# Tag push or Actions → Run workflow. Publishes executable zips
# (creasy[.exe] + .env.example + opencoderman review pack +
# install-review-agent scripts). Linux is one zip per Ubuntu LTS
# plus linux-x64 (Ubuntu 22.04). The tag's "Source code" zip is
# not an operator download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  exe:
    name: Executable ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build deps
        run: python -m pip install -e . pyinstaller
      - name: Build executable zip
        run: python packaging/build_exe.py --suffix ${{ matrix.suffix }} --zip --out-dir dist/exe
      - name: Read product version
        id: ver
        shell: bash
        run: echo "version=$(python -c "from pathlib import Path; print(Path('VERSION').read_text(encoding='utf-8').strip())")" >> "$GITHUB_OUTPUT"
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          path: dist/exe/creasy-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}.zip
          if-no-files-found: error

  exe-linux:
    name: Executable linux-ubuntu-${{ matrix.ubuntu }}-x64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["18.04", "20.04", "22.04", "24.04"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          test -f web/dist/index.html
      - name: Build exe in Ubuntu ${{ matrix.ubuntu }}
        run: bash packaging/linux_exe_in_docker.sh ${{ matrix.ubuntu }}
      - name: Read product version
        id: ver
        run: echo "version=$(python3 -c "from pathlib import Path; print(Path('VERSION').read_text(encoding='utf-8').strip())")" >> "$GITHUB_OUTPUT"
      - name: Alias Ubuntu 22.04 as linux-x64
        if: matrix.ubuntu == '22.04'
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          cp "dist/exe/creasy-${v}-linux-ubuntu-22.04-x64.zip" "dist/exe/creasy-${v}-linux-x64.zip"
      - name: Upload Ubuntu zip
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-linux-ubuntu-${{ matrix.ubuntu }}-x64
          path: dist/exe/creasy-${{ steps.ver.outputs.version }}-linux-ubuntu-${{ matrix.ubuntu }}-x64.zip
          if-no-files-found: error
      - name: Upload linux-x64 alias
        if: matrix.ubuntu == '22.04'
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-linux-x64
          path: dist/exe/creasy-${{ steps.ver.outputs.version }}-linux-x64.zip
          if-no-files-found: error

  publish:
    needs: [exe, exe-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Read product version
        id: ver
        run: echo "version=$(python -c "from pathlib import Path; print(Path('VERSION').read_text(encoding='utf-8').strip())")" >> "$GITHUB_OUTPUT"
      - name: Download executable zips
        uses: actions/download-artifact@v4
        with:
          pattern: creasy-${{ steps.ver.outputs.version }}-*
          path: dist/exe
          merge-multiple: true
      - name: Assert only exe zips
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          for suffix in windows-x64 darwin-arm64 linux-x64 \
            linux-ubuntu-18.04-x64 linux-ubuntu-20.04-x64 \
            linux-ubuntu-22.04-x64 linux-ubuntu-24.04-x64; do
            test -f "dist/exe/creasy-${v}-${suffix}.zip"
          done
          test "$(ls -1 dist/exe/*.zip | wc -l)" = "7"
      - name: Write release notes
        run: python scripts/release_notes.py --version "${{ steps.ver.outputs.version }}" --out release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Creasy ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/exe/creasy-*-windows-x64.zip
            dist/exe/creasy-*-linux-x64.zip
            dist/exe/creasy-*-linux-ubuntu-*-x64.zip
            dist/exe/creasy-*-darwin-arm64.zip
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false
