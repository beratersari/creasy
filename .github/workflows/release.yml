name: release

# Tag push or Actions → Run workflow. Publishes one executable zip
# per platform (creasy[.exe] + .env.example). The tag's
# "Source code" zip is not an operator download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  exe:
    name: Executable ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
          - os: ubuntu-latest
            suffix: linux-x64
          - os: macos-latest
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build deps
        run: python -m pip install -e . pyinstaller
      - name: Build executable zip
        run: python packaging/build_exe.py --suffix ${{ matrix.suffix }} --zip --out-dir dist/exe
      - name: Read product version
        id: ver
        shell: bash
        run: echo "version=$(python -c "from pathlib import Path; print(Path('VERSION').read_text(encoding='utf-8').strip())")" >> "$GITHUB_OUTPUT"
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          path: dist/exe/creasy-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}.zip
          if-no-files-found: error

  publish:
    needs: exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Read product version
        id: ver
        run: echo "version=$(python -c "from pathlib import Path; print(Path('VERSION').read_text(encoding='utf-8').strip())")" >> "$GITHUB_OUTPUT"
      - name: Download executable zips
        uses: actions/download-artifact@v4
        with:
          pattern: creasy-${{ steps.ver.outputs.version }}-*
          path: dist/exe
          merge-multiple: true
      - name: Assert only exe zips
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          for suffix in windows-x64 linux-x64 darwin-arm64; do
            test -f "dist/exe/creasy-${v}-${suffix}.zip"
          done
          test "$(ls -1 dist/exe/*.zip | wc -l)" = "3"
      - name: Write release notes
        run: python scripts/release_notes.py --version "${{ steps.ver.outputs.version }}" --out release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Creasy ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/exe/creasy-*-windows-x64.zip
            dist/exe/creasy-*-linux-x64.zip
            dist/exe/creasy-*-darwin-arm64.zip
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false
