name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install (online, tests)
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q --tb=short

  offline-linux:
    name: OSM-style offline (Linux)
    runs-on: ubuntu-latest
    env:
      CREASY_NONINTERACTIVE: "1"
      PORT: "8000"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build offline packs (folders, not zips)
        run: python packaging/build_dist.py --out-dir dist
      - name: Read product version
        id: ver
        run: echo "version=$(python -c "from pathlib import Path; print(Path('VERSION').read_text(encoding='utf-8').strip())")" >> "$GITHUB_OUTPUT"
      - name: Upload Linux pack
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-linux-x64
          path: dist/stage/creasy-${{ steps.ver.outputs.version }}-linux-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows pack
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/stage/creasy-${{ steps.ver.outputs.version }}-windows-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Darwin pack
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-darwin
          path: dist/stage/creasy-${{ steps.ver.outputs.version }}-darwin/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows+Linux pack
        uses: actions/upload-artifact@v4
        with:
          name: creasy-${{ steps.ver.outputs.version }}-windows-linux
          path: dist/stage/creasy-${{ steps.ver.outputs.version }}-windows-linux/
          if-no-files-found: error
          retention-days: 30
      - name: Install + start from the Linux pack
        run: |
          set -euo pipefail
          root="dist/stage/creasy-${{ steps.ver.outputs.version }}-linux-x64"
          test -f "$root/pyproject.toml"
          chmod +x "$root"/scripts/*.sh "$root"/*.sh || true
          (cd "$root" && scripts/install.sh)
          (cd "$root" && scripts/install-opencode.sh)
          (cd "$root" && scripts/start.sh > /tmp/creasy-start.log 2>&1) &
          echo $! > /tmp/creasy.pid
          ok=0
          for _ in $(seq 1 45); do
            if curl -sf --max-time 2 "http://127.0.0.1:8000/health" >/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$(cat /tmp/creasy.pid)" 2>/dev/null; then
              echo "start.sh exited before /health"
              cat /tmp/creasy-start.log || true
              exit 1
            fi
            sleep 2
          done
          test "$ok" = "1"
          curl -sf "http://127.0.0.1:8000/health"
          echo
          code=$(curl -sf -o /tmp/jobs.html -w "%{http_code}" "http://127.0.0.1:8000/jobs")
          test "$code" = "200"
          grep -q "Creasy" /tmp/jobs.html
          grep -q "/assets/" /tmp/jobs.html
          kill "$(cat /tmp/creasy.pid)" 2>/dev/null || true
          wait "$(cat /tmp/creasy.pid)" 2>/dev/null || true
      - name: Show start log on failure
        if: failure()
        run: cat /tmp/creasy-start.log || true

  offline-windows:
    name: OSM-style offline (Windows)
    runs-on: windows-latest
    env:
      CREASY_NONINTERACTIVE: "1"
      PORT: "8000"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build_dist --in-place
        run: python packaging/build_dist.py --in-place
      - name: Offline install.bat
        shell: cmd
        run: scripts\install.bat
      - name: Offline install-opencode.bat
        shell: cmd
        run: scripts\install-opencode.bat
      - name: start.bat (new window + health wait)
        shell: cmd
        run: |
          call scripts\start.bat
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/jobs | findstr /C:"Creasy"
          curl -sf http://127.0.0.1:8000/jobs | findstr /C:"/assets/"
